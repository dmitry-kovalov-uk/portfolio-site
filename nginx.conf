server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    set $maint 0;
    if (-f /etc/nginx/flags/maintenance) {
        set $maint 1;
    }

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
    }

    location / {
        if ($maint) {
            return 503;
        }
        try_files $uri $uri/ /index.html;
    }
}
