name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp asset version with commit SHA
        run: |
          SHA=${GITHUB_SHA::8}
          sed -i "s/?v=[a-z0-9]*/?v=$SHA/g" src/index.html

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src/,Dockerfile,docker-compose.yml,nginx.conf"
          target: /opt/kovalov-site

      - name: Rebuild and restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/kovalov-site
            mkdir -p flags && touch flags/maintenance
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            rm -f flags/maintenance
