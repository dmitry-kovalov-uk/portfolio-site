apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: default
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web            # ловит поды Deployment'а web
  ports:
    - port: 80          # порт самого Service (внутри кластера)
      targetPort: 80    # порт контейнера (nginx)
      nodePort: 30080   # стабильный порт на ноде — сюда ходит host nginx
